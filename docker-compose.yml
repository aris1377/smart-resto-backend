# Lokal ishlab chiqish uchun yordamchi servislar.
# Faza 12 da bu yerga app, postgres va redis ham qo'shiladi.
services:
  # Faza 6: Socket.IO xonalarini instansiyalar orasida ulashish uchun.
  # Boshqa loyihaning Redis'i 6379 da ishlab turgan boʻlsa, buni
  # koʻtarish shart emas — REDIS_HOST/REDIS_PORT shunchaki unga ishora qiladi.
  redis:
    image: redis:7-alpine
    container_name: smart-resto-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: smart-resto-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9200:9000' # S3 API (9000 boshqa loyihaning MinIO'sida band)
      - '9201:9001' # brauzerdagi konsol
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio-data:
  redis-data:
